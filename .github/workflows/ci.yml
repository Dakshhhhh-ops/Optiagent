name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: optiagent
          POSTGRES_PASSWORD: optiagent
          POSTGRES_DB: optiagent_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U optiagent" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: pytest
        run: |
          set -o pipefail
          uv run pytest -q 2>&1 | tee pytest.log
      - name: API tests on Postgres
        env:
          OPTIAGENT_TEST_DATABASE_URL: postgresql://optiagent:optiagent@localhost:5432/optiagent_test
        run: |
          set -o pipefail
          uv run pytest -q api/tests 2>&1 | tee -a pytest.log
      - name: Report pytest failure
        if: failure()
        # Surface the end of the log as an annotation so it is visible without opening the logs.
        run: echo "::error title=pytest::$(tail -c 3000 pytest.log | tr '\n' '|' )"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f api/Dockerfile -t optiagent-api .
      - name: API image starts and answers /health
        run: |
          docker run -d --name api -p 8000:8000 -e PORT=8000 optiagent-api
          for i in $(seq 1 30); do
            if curl -fsS localhost:8000/health; then exit 0; fi
            sleep 2
          done
          docker logs api
          exit 1
      - name: Solve an example inside the container
        run: |
          problem=$(curl -fsS localhost:8000/api/v1/examples/t2_sunray | python3 -c "import json,sys; print(json.dumps(json.load(sys.stdin)['problem']))")
          curl -fsS -X POST localhost:8000/api/v1/solve -H 'content-type: application/json' -d "$problem" \
            | python3 -c "import json,sys; r=json.load(sys.stdin); assert r['result']['objective']==435 and r['verified'], r['result']; print('solved 435, verified')"
      - name: Build web image
        run: docker build -t optiagent-web --build-arg NEXT_PUBLIC_API_URL=http://localhost:8000 web
