[project]
name = "optiagent-eval"
version = "0.1.0"
description = "Benchmarks and evaluation harness for OptiAgent"
requires-python = ">=3.12,<3.14"
dependencies = ["optiagent-core", "optiagent-agent"]

[tool.uv.sources]
optiagent-core = { workspace = true }
optiagent-agent = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/optiagent_eval"]
