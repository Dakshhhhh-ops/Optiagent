[project]
name = "optiagent"
version = "0.1.0"
description = "Natural language to verified optimization"
requires-python = ">=3.12,<3.14"
dependencies = ["optiagent-core", "optiagent-agent", "optiagent-api", "optiagent-eval"]

[tool.uv.workspace]
members = ["core", "agent", "api", "eval"]

[tool.uv.sources]
optiagent-core = { workspace = true }
optiagent-agent = { workspace = true }
optiagent-api = { workspace = true }
optiagent-eval = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-openpyxl>=3.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# Typography used deliberately in user-facing text.
allowed-confusables = ["–", "×", "→"]

[tool.ruff.lint.per-file-ignores]
# Vocabulary tables for generated problems read best one record per line.
"eval/src/optiagent_eval/generate.py" = ["E501"]
"eval/src/optiagent_eval/mutations.py" = ["E501"]
# One-line user-facing messages and regexes read better unwrapped.
"agent/src/optiagent_agent/audit.py" = ["E501"]
"agent/src/optiagent_agent/textfacts.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["optiagent_core", "optiagent_agent", "optiagent_api", "optiagent_eval"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["optiagent_core", "optiagent_agent", "optiagent_api", "optiagent_eval"]

[[tool.mypy.overrides]]
module = ["ortools.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["core/tests", "agent/tests", "api/tests", "eval/tests"]
asyncio_mode = "auto"
addopts = "--import-mode=importlib --basetemp=.pytest_cache/tmp"
filterwarnings = ["ignore:builtin type .* has no __module__ attribute:DeprecationWarning"]

[tool.uv]
package = false
