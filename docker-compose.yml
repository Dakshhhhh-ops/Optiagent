# Ports are configurable in case 8000/3000 are taken on the host:
#   API_PORT=8001 WEB_PORT=3000 docker compose up --build
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: optiagent
      POSTGRES_PASSWORD: optiagent
      POSTGRES_DB: optiagent
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U optiagent"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      OPTIAGENT_POSTGRES_HOST: postgres
      OPTIAGENT_REDIS_HOST: redis
      # Ollama runs on the host machine, not in a container.
      OPTIAGENT_OLLAMA_BASE_URL: http://host.docker.internal:11434
      OPTIAGENT_OLLAMA_MODEL: ${OPTIAGENT_OLLAMA_MODEL:-qwen3:8b}
      OPTIAGENT_CORS_ORIGINS: '["http://localhost:${WEB_PORT:-3000}"]'
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["${API_PORT:-8000}:8000"]
    volumes:
      - appdata:/app/data # saved projects (SQLite)
      - uploads:/app/uploads # uploaded datasets
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  web:
    build:
      context: web
      args:
        # Baked into the browser bundle, so it must be the API address as seen from the host.
        NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-8000}
    ports: ["${WEB_PORT:-3000}:3000"]
    depends_on: [api]

volumes:
  pgdata:
  appdata:
  uploads:
