[project]
name = "optiagent-api"
version = "0.1.0"
description = "FastAPI service for OptiAgent"
requires-python = ">=3.12,<3.14"
dependencies = [
    "optiagent-core",
    "optiagent-agent",
    "optiagent-eval",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "sentry-sdk>=2.0",
]

[tool.uv.sources]
optiagent-core = { workspace = true }
optiagent-agent = { workspace = true }
optiagent-eval = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/optiagent_api"]
