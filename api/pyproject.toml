[project]
name = "optiagent-api"
version = "0.1.0"
description = "FastAPI service for OptiAgent"
requires-python = ">=3.12,<3.14"
dependencies = [
    "optiagent-core",
    "optiagent-agent",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
]

[tool.uv.sources]
optiagent-core = { workspace = true }
optiagent-agent = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/optiagent_api"]
