[project]
name = "optiagent-core"
version = "0.1.0"
description = "Deterministic optimization engine: schema, model builder, solver, checks, analysis"
requires-python = ">=3.12,<3.14"
dependencies = [
    "highspy>=1.8",
    "openpyxl>=3.1",
    "ortools>=9.12",
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/optiagent_core"]
